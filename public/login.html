<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login System - Dashboard Dalduk Banten</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .glow-effect {
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body class="text-slate-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-4 glow-effect">
        <i class="fa-solid fa-shield-halved text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Admin & Officer Portal</h1>
      <p class="text-sm text-slate-400 mt-1">Sistem Informasi Pengendalian Penduduk (Dalduk)</p>
    </div>

    <!-- Login Glass Card -->
    <div class="glass-card rounded-2xl p-8">
      
      <!-- Alert Message -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border transition-all duration-200">
        <div class="flex items-center gap-3">
          <i id="alertIcon" class="fa-solid text-base"></i>
          <span id="alertMessage"></span>
        </div>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="usernameOrEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
            Username / Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-user text-sm"></i>
            </div>
            <input 
              type="text" 
              id="usernameOrEmail" 
              name="usernameOrEmail"
              required 
              placeholder="Masukkan username atau email"
              class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password"
              required 
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-3 bg-slate-900/60 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            >
            <button 
              type="button"
              id="togglePassword"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white"
            >
              <i class="fa-solid fa-eye text-sm" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="btnSubmit"
          class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all flex items-center justify-center gap-2"
        >
          <span id="btnText">Masuk Ke Sistem</span>
          <i id="btnSpinner" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-700/50 text-center">
        <a href="/dashboard" class="inline-flex items-center gap-2 text-xs font-medium text-slate-400 hover:text-indigo-400 transition">
          <i class="fa-solid fa-arrow-left"></i>
          Kembali ke Dashboard Publik
        </a>
      </div>

    </div>

    <!-- Default Credentials Hint Card -->
    <div class="mt-6 p-4 rounded-xl bg-slate-900/40 border border-slate-800 text-center text-xs text-slate-400">
      <span class="text-slate-300 font-semibold">Akun Default Admin:</span> Username: <code class="text-indigo-300 bg-slate-800 px-1.5 py-0.5 rounded">admin</code> | Password: <code class="text-indigo-300 bg-slate-800 px-1.5 py-0.5 rounded">admin123</code>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const alertIcon = document.getElementById('alertIcon');
    const alertMessage = document.getElementById('alertMessage');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    // Toggle Password Visibility
    togglePassword.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    function showAlert(type, message) {
      alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      if (type === 'error') {
        alertBox.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
        alertIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
      } else {
        alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
        alertIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      }
      alertMessage.innerText = message;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
      const password = passwordInput.value;

      if (!usernameOrEmail || !password) {
        showAlert('error', 'Semua kolom wajib diisi');
        return;
      }

      // Set Loading State
      btnSubmit.disabled = true;
      btnText.innerText = 'Memproses...';
      btnSpinner.classList.remove('hidden');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernameOrEmail, password }),
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showAlert('success', 'Login Berhasil! Mengalihkan ke Admin Panel...');
          localStorage.setItem('auth_token', result.token);
          localStorage.setItem('user_info', JSON.stringify(result.user));

          setTimeout(() => {
            window.location.href = '/admin';
          }, 1000);
        } else {
          showAlert('error', result.error || 'Login gagal, periksa data Anda.');
          btnSubmit.disabled = false;
          btnText.innerText = 'Masuk Ke Sistem';
          btnSpinner.classList.add('hidden');
        }
      } catch (err) {
        showAlert('error', 'Terjadi kesalahan koneksi server.');
        btnSubmit.disabled = false;
        btnText.innerText = 'Masuk Ke Sistem';
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
